# sorting-hat configuration. Every value here can be overridden on the command
# line; see `sorting-hat --help`.

source  = "/home/mbruno/Nextcloud/DungeonsAndDragons/PDFs"
work_dir = "tmp"
library = "tmp/library"

[extract]
# Leading pages read from each PDF. The front matter is where a TTRPG document
# says what it is; going deeper costs time and adds little.
pages = 12
# Characters of that text handed to the model.
max_chars = 6000
# Below this many extracted characters, the PDF is an image scan and is judged
# from its file name and metadata alone.
scanned_threshold = 200
timeout_secs = 60

[model]
path = "models/Qwen2.5-14B-Instruct-Q5_K_M.gguf"
# 999 offloads every layer to the GPU. Lower it if VRAM is tight.
gpu_layers = 999
context = 8192
max_tokens = 512
seed = 1337
# chatml | llama3 | mistral | plain
template = "chatml"

[taxonomy]
max_leaves = 40
max_depth = 3
# A folder with fewer documents than this is folded into its parent, so the
# library does not sprout single-file directories.
min_docs_per_leaf = 3
# Below this confidence a document goes to _Unsorted rather than being guessed at.
min_confidence = 0.45

[vision]
# Used only for PDFs that yield almost no text: map products, poster sheets and
# image-scanned books. Set enabled = false to skip it entirely.
enabled = true
path = "models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
mmproj = "models/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf"
gpu_layers = 999
context = 8192
max_tokens = 512
template = "chatml"
# Longest edge of the rendered page, in pixels; aspect ratio is preserved.
max_pixels = 2100
# Caps what the projector may spend on one image. Measured against
# Qwen2.5-VL-7B: 2048 is safe, 3072 aborts llama.cpp outright. Raising this without
# this can overrun the vision encoder's buffers and abort llama.cpp outright.
image_max_tokens = 2048
